name: Release

# Fires on version tags only (e.g. `git tag v1.1.0 && git push --tags`) —
# ordinary pushes to main run CI but never publish a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp into the build (no leading v)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  # Resolved once and shared, so the two builds can't disagree about what
  # version they're producing.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        # The tag is the source of truth for a tagged run; the manual input
        # covers workflow_dispatch, where there is no tag to read.
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

  # macOS ships the native Swift app (mac-native/), not Electron.
  build-mac:
    needs: version
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test
        working-directory: mac-native
        # Never ship a build whose parsers no longer agree with the fixtures.
        run: swift test

      - name: Build artifacts
        working-directory: mac-native
        # Unsigned on purpose: signing for distribution needs a Developer ID
        # certificate (paid Apple Developer Program), which this project does
        # not have. The README documents the Gatekeeper prompt that results.
        run: make dist VERSION=${{ needs.version.outputs.version }}

      - name: Verify artifacts
        working-directory: mac-native
        run: |
          set -euo pipefail
          test -f dist/AI-Usage.dmg
          test -f dist/AI-Usage.zip
          # Prove the packaged bundle is intact rather than trusting that
          # hdiutil exiting 0 means the app inside actually survived.
          MP=$(hdiutil attach dist/AI-Usage.dmg -nobrowse -readonly | tail -1 | awk -F'\t' '{print $NF}')
          plutil -lint "$MP/AI Usage.app/Contents/Info.plist"
          STAMPED=$(plutil -extract CFBundleShortVersionString raw "$MP/AI Usage.app/Contents/Info.plist")
          test "$STAMPED" = "${{ needs.version.outputs.version }}"
          test -x "$MP/AI Usage.app/Contents/MacOS/ptydrive"
          ICON=$(plutil -extract CFBundleIconFile raw "$MP/AI Usage.app/Contents/Info.plist")
          test -f "$MP/AI Usage.app/Contents/Resources/$ICON"
          # arm64 is what the Homebrew cask declares; shipping a bundle that
          # doesn't match would install cleanly and then fail to launch.
          lipo -archs "$MP/AI Usage.app/Contents/MacOS/AI Usage" | grep -qw arm64
          hdiutil detach "$MP" -quiet
          echo "artifacts OK (version $STAMPED)"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            mac-native/dist/AI-Usage.dmg
            mac-native/dist/AI-Usage.zip
          if-no-files-found: error

  # Windows ships the Electron app (os-menu/) — the native rebuild is macOS
  # only, so this stays the Windows implementation.
  build-win:
    needs: version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stamp version
        working-directory: os-menu
        shell: bash
        # electron-builder reads the version from package.json, so the tag has
        # to be written in before the build rather than passed as a flag.
        run: |
          set -euo pipefail
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
          node -e "console.log('package.json version:', require('./package.json').version)"

      - name: Install dependencies
        working-directory: os-menu
        # `npm ci` — package-lock.json is committed, and a release build is the
        # one place the exact dependency versions have to be reproducible.
        # `npm version` above updates the lockfile alongside package.json, so
        # the two are still in sync here.
        run: npm ci

      - name: Test
        working-directory: os-menu
        # The Windows PTY driver is the whole fetch path on this platform;
        # never ship a build whose state machine regressed.
        run: npm test

      - name: Build installer
        working-directory: os-menu
        run: npm run build:win

      - name: Verify artifact
        working-directory: os-menu
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          test -f dist/AI-Usage-Setup.exe
          # electron-builder leaves the unpacked tree beside the installer;
          # checking it catches a config regression that the .exe existing does
          # not — a missing node-pty means every provider reports nothing.
          test -d "dist/win-unpacked/resources/app.asar.unpacked/node_modules/node-pty"
          echo "installer OK"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: os-menu/dist/AI-Usage-Setup.exe
          if-no-files-found: error

  # One job creates the release with every asset attached. The two builds
  # therefore run in parallel and neither races the other to create it —
  # which is the only reason the old workflow had to serialise them.
  publish:
    needs: [version, build-mac, build-win]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List assets
        run: find artifacts -type f -print

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/macos/AI-Usage.dmg
            artifacts/macos/AI-Usage.zip
            artifacts/windows/AI-Usage-Setup.exe

  # Point the Homebrew cask at the release that was just published. The cask
  # pins its download by hash, so without this `brew install` keeps handing
  # people the previous version indefinitely.
  #
  # Needs a TAP_GITHUB_TOKEN secret — a PAT with `contents: write` on
  # eli-manning/homebrew-tap, since GITHUB_TOKEN only reaches this repo. The
  # job no-ops with a notice rather than failing the release if it is absent.
  bump-cask:
    needs: [version, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Check for the tap token
        id: token
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TAP_GITHUB_TOKEN is not set; skipping the Homebrew cask bump."
          fi

      - uses: actions/download-artifact@v4
        if: steps.token.outputs.present == 'true'
        with:
          name: macos
          path: macos

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          repository: eli-manning/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Update the cask
        if: steps.token.outputs.present == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          SHA=$(sha256sum macos/AI-Usage.zip | cut -d' ' -f1)
          CASK=tap/Casks/ai-usage.rb
          # Anchored to the stanza names so this can't rewrite the sha256 of
          # some other cask, or the version inside a URL.
          sed -i -E "s|^  version \".*\"$|  version \"${VERSION}\"|" "$CASK"
          sed -i -E "s|^  sha256 \".*\"$|  sha256 \"${SHA}\"|" "$CASK"
          grep -q "version \"${VERSION}\"" "$CASK"
          grep -q "sha256 \"${SHA}\"" "$CASK"
          cat "$CASK"

      - name: Commit and push
        if: steps.token.outputs.present == 'true'
        working-directory: tap
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "cask already at $VERSION"
            exit 0
          fi
          git commit -am "ai-usage $VERSION"
          git push
