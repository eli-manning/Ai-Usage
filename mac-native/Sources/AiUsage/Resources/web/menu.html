<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AI Usage</title>
<link rel="stylesheet" href="pet.css">
<link rel="stylesheet" href="ui.css">
<style>
  /* The menu bar dropdown: Mochi's panel hanging from the menu bar, one tab per provider. */
  header .face { width: 46px; height: 40px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; margin: -8px -4px -2px -8px; }
  header .face .critter { margin-bottom: -5px; }
  .ghost.spin .px-icon { animation: spin 0.8s steps(8, end) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  nav .tab-dot { display: inline-block; width: 4px; height: 4px; margin-left: 3px; vertical-align: 3px; background: var(--line); }
  nav .tab-dot.ok { background: #4fae68; }
  nav .tab-dot.warn { background: #e0a43b; }
  nav .tab-dot.bad { background: var(--red); }
  nav button.on .tab-dot { box-shadow: 0 0 0 1px #fff; }

  .banner { margin: 10px 0 2px; padding: 4px 8px 5px; font-size: 14px; background: #fff1d6; color: #8a5a1f; }
  .meter:first-child { margin-top: 10px; }
  .meter .top .pct { font-size: 20px; line-height: 0.9; }
  .meter .sub { display: flex; justify-content: space-between; gap: 8px; }

  .details-toggle { display: flex; justify-content: center; margin: 6px 0 2px; }
  .details-toggle .pxb { padding: 2px 10px 3px; font-size: 15px; }
  #body.scroll { max-height: 430px; }

  /* history: one column per hour (or six hours for a week), ten blocks tall */
  .chart { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; align-items: end; height: 54px; padding: 4px 4px 3px; margin: 2px 2px 4px;
    background: var(--soft); box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink); }
  .chart i { display: block; min-height: 2px; background: var(--fill, var(--orange)); }
  .chart i.none { background: transparent; }
  .chart-axis { display: flex; justify-content: space-between; margin: 0 2px; }
  .promo { margin-top: 8px; color: var(--orange); font-size: 14px; }
  .fact { margin-top: 8px; font-size: 14px; color: var(--muted); }
  .set .pct { color: var(--orange); }
  .stats { gap: 10px 6px; }
  .stats b { font-size: 19px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats span { font-size: 13px; }
  .empty p { color: var(--ink); font-size: 17px; margin-bottom: 8px; }
  .empty .hint { margin: -6px 0 12px; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
  .empty.error p { color: var(--red); }
</style>
</head>
<body>
<div id="wrap" class="below">
<div id="card" class="card px-bubble" tabindex="-1">
  <header>
    <div class="face" id="face"></div>
    <div class="who"><div class="name" id="name"></div><div class="mood" id="mood"></div></div>
    <button class="ghost" id="refresh" title="refresh now"></button>
    <button class="ghost" id="gear" title="settings"></button>
  </header>
  <nav id="tabs"></nav>
  <div id="body"></div>
  <div class="foot"><span class="muted" id="version"></span><button class="pxb" id="quit">quit</button></div>
</div>
</div>
<script src="pet.js"></script>
<script src="icons.js"></script>
<script src="looks.js"></script>
<script src="menu.js"></script>
</body>
</html>
